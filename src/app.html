<title>Arranger ST</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  /* Layout: the 1-bit GEM screen fills the window; a status line and the playable key strip sit flush under it */
  --bg:#0c0c0d; --paper:#fff; --ink:#000; --hi:#fff; --dim:#8c8c88;
  --f-screen:'VT323',ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--hi)}
body{font-family:var(--f-screen);margin:0;overflow:hidden}
.app{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
#screen{display:block;cursor:none;touch-action:none;background:var(--paper)}
.status{display:flex;align-items:baseline;gap:10px;box-sizing:border-box;height:calc(26px*var(--u));padding:0 8px;background:var(--ink);color:var(--hi);
  font-size:calc(19px*var(--u));line-height:calc(26px*var(--u));white-space:nowrap;overflow:hidden;border-top:1px solid var(--hi)}
.status b{font-weight:normal;background:var(--hi);color:var(--ink);padding:0 5px;flex:none}
.status span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.status kbd{font-family:inherit;border:1px solid var(--hi);padding:0 5px;line-height:1;flex:none}
.status em{font-style:normal;color:var(--dim);flex:none}
.kb{position:relative;box-sizing:border-box;height:calc(74px*var(--u,1));background:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;border-top:1px solid var(--hi)}
.kb .w,.kb .k{position:absolute;top:0;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  font-size:calc(16px*var(--u,1));line-height:1;padding-bottom:4px;cursor:pointer}
.kb .w{height:100%;background:var(--paper);color:var(--ink);border-right:1px solid var(--ink)}
.kb .k{height:58%;background:var(--ink);color:var(--hi);z-index:2;border:1px solid var(--hi);border-top:0}
.kb .on.w{background:repeating-conic-gradient(var(--ink) 0 25%,var(--paper) 0 50%) 0 0/2px 2px}
.kb .on.k{background:repeating-conic-gradient(var(--hi) 0 25%,var(--ink) 0 50%) 0 0/2px 2px}
.kb small{font-size:calc(13px*var(--u,1))}
</style>

<div class="app">
  <canvas id="screen" width="640" height="400"></canvas>
  <div class="status" id="status"><b id="hintT">ARRANGER ST</b><span id="hintD">Click to start the audio engine, then press Space. Letter keys play notes. F1–F6 switch windows.</span><kbd id="hintK" hidden></kbd><em id="saveLbl"></em></div>
  <div class="kb" id="kb"></div>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</div>

<script type="text/plain" id="wk">@@ENGINE@@</script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const PPQ=96,BAR=PPQ*4,NBARS=64,W=640,H=400,VIS=16,BARPX=30,TLX=160,TRY=56,TRH=35,TBY=338;

const TOOLS_ARR=['pointer','pencil','eraser','scissors','glue','mute'],TOOLS_EDIT=['pointer','pencil','eraser'];
const NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const nname=p=>NN[p%12]+(Math.floor(p/12)-2);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad=(n,l)=>String(n).padStart(l,'0');
const MV_NAMES=@@MVNAMES@@;

/* ---------- parameters: 0..30 are the DS-10 patch knobs, 31..36 the track strip ---------- */
const SRC=['---','SIN','SAW','SQR','S&H','EG','VCO2'];
const WAV=['TRI','SAW','SQR','NSE'];
const P=[
  ['OCTAVE','VCO OCTAVE',-2,2,0],['EG INT','VCO EG INT',-63,63,0],['PORTA','PORTAMENTO',0,127,0],
  ['PITCH','PATCH PITCH DEPTH',-63,63,0],['VCO1','PATCH VCO1 DEPTH',-63,63,0],['VCO2','PATCH VCO2 DEPTH',-63,63,0],
  ['WAVE','VCO1 WAVE',0,3,1,WAV],['WAVE','VCO2 WAVE',0,3,1,WAV],['PITCH','VCO2 PITCH',-63,63,0],
  ['BALANCE','VCO1/VCO2 BALANCE',0,127,0],['SYNC','VCO2 SYNC',0,1,0,['OFF','ON']],
  ['CUTOFF','VCF CUTOFF',0,127,127],['PEAK','VCF PEAK',0,127,0],['TYPE','VCF TYPE',0,2,0,['LPF','HPF','BPF']],
  ['EG INT','VCF EG INT',-63,63,0],['CUTOFF','PATCH CUTOFF DEPTH',-63,63,0],['VCA','VCA EG',0,1,0,['EG','GATE']],
  ['VCA','PATCH VCA DEPTH',-63,63,0],['DRIVE','DRIVE',0,127,0],['LEVEL','LEVEL',0,127,100],
  ['ATTACK','EG ATTACK',0,127,0],['DECAY','EG DECAY',0,127,127],['SUSTAIN','EG SUSTAIN',0,127,127],['RELEASE','EG RELEASE',0,127,0],
  ['FREQ','MG FREQ',0,127,50],['SYNC','MG BPM SYNC',0,1,1,['FREE','BPM']],
  ['SRC','PITCH SOURCE',0,6,0,SRC],['SRC','VCO1 SOURCE',0,6,0,SRC],['SRC','VCO2 SOURCE',0,6,0,SRC],['SRC','CUTOFF SOURCE',0,6,0,SRC],['SRC','VCA SOURCE',0,6,0,SRC],
  ['HP CUT','HPF CUTOFF',0,127,0],['HP RES','HPF RESONANCE',0,127,0],
  ['VOLUME','VOLUME',0,127,100],['PAN','PAN',0,127,64],['SEND A','SEND A',0,127,0],['SEND B','SEND B',0,127,0]];
const NP=P.length,INIT_K=P.map(p=>p[4]);
const pfmt=(id,v)=>{const p=P[id];if(p[5])return p[5][v]??String(v);if(id===34)return v===64?'C':v<64?'L'+(64-v):'R'+(v-64);if(p[2]<0&&v>0)return '+'+v;return String(v);};

/* ---------- effects ---------- */
const FXDEF={
  ds10:{name:'DS-10 FX',short:'D10',p:[['type','TYPE',0,2,0,['DELAY','CHORUS','FLANGER']],['time','TIME',0,127,64],['ratio','L/R RATIO',-63,63,0],['lfo','LFO RATE',0,127,64],['depth','DEPTH',0,127,64],['sync','SYNC',0,1,0,['FREE','BPM']],['fb','FEEDBACK',-63,63,0],['mix','DRY/WET',0,127,64]]},
  mverb:{name:'MIDIVERB',short:'MVB',p:[['dev','MODEL',0,2,2,['MV I','FEX','MV II']],['prog','PROGRAM',0,99,15],['fb','FEEDBACK',0,127,0],['mix','DRY/WET',0,127,64]]},
  tape:{name:'TAPE DELAY',short:'TAP',p:[['speed','SPEED',0,127,60],['fb','FEEDBACK',0,127,89],['len','TAPE',0,3,2,['30 MS','100 MS','300 MS','1 SEC']],['mix','DRY/WET',0,127,64]]},
  dist:{name:'DISTORTION',short:'DST',p:[['drive','DRIVE',0,127,64],['tone','TONE',0,127,90],['level','LEVEL',0,127,80],['mix','DRY/WET',0,127,127]]}};
const FXTYPES=['ds10','mverb','tape','dist'];
function mkFx(type,over){const d=FXDEF[type],p={};d.p.forEach(x=>p[x[0]]=x[4]);return {type,on:true,p:Object.assign(p,over||{})};}
function progMax(fx){return fx.p.dev===2?99:63;}
function progName(fx){const n=MV_NAMES[fx.p.dev]||[];const i=clamp(fx.p.prog,0,n.length-1);return (fx.p.dev===2?i:i+1)+' '+(n[i]||'');}

/* ---------- state ---------- */
const S={tracks:[],buses:[],master:null,parts:[],nextId:1,active:0,sel:null,view:'arr',editPart:null,selNote:null,
  tool:'pointer',arrTool:'pointer',pos:0,L:0,R:BAR*8,cycle:false,playing:false,rec:false,recMode:'overdub',
  tempo:120,qi:4,autoQ:true,click:false,scroll:0,oct:2,qwerty:true,midi:false,
  menu:null,popup:null,dialog:null,toolbox:null,step:false,stepPos:0,stepHeld:0,editHi:72,takeId:0,
  mx:-1,my:-1,lastIn:null,inFlash:0,drag:null,pencil:null,lane:'vel',
  fxSel:{w:{s:'t',i:0},slot:0},showKb:true,padX:11,padY:12,padMode:'s',padOn:false,padVX:.5,padVY:.5,clip:null};
const gate=new Array(8).fill(0);
let dirty=true;
const q=()=>QS[S.qi][1];
const part=id=>S.parts.find(p=>p.id===id);

function mkTrack(name,k,nv){const kk=INIT_K.slice();for(const i in (k||{}))kk[i]=k[i];return {name,nv:nv||1,k:kk,lv:kk.slice(),mute:false,solo:false,ins:[null,null]};}
function patch(o){const k={};const map={oct:0,egp:1,porta:2,pPitch:3,pV1:4,pV2:5,w1:6,w2:7,v2pitch:8,bal:9,sync:10,cut:11,peak:12,ftype:13,egf:14,pCut:15,vcaeg:16,pVca:17,drive:18,level:19,a:20,d:21,s:22,r:23,mg:24,mgbpm:25,sPitch:26,sV1:27,sV2:28,sCut:29,sVca:30,hpc:31,hpr:32,vol:33,pan:34,sa:35,sb:36};for(const n in o)k[map[n]]=o[n];return k;}

/* ---------- song ---------- */
function mkPart(track,startBar,bars,notes,name){
  return {id:S.nextId++,track,start:startBar*BAR,len:bars*BAR,notes:notes.map(n=>({...n})),mute:false,name:name||S.tracks[track].name,auto:{}};
}
// The DS-10's 24 factory synth patches (knobs 0-30), from the ROM files in ds10emu
const FACTORY=[["INIT",[0,0,0,0,0,0,1,1,3,0,0,127,0,0,0,0,0,0,0,105,0,66,127,0,19,0,0,0,0,0,0]],["BASS1",[-1,0,0,0,0,0,2,1,3,0,0,10,50,0,46,0,0,0,27,127,0,53,29,23,21,0,0,0,0,0,0]],["BASS2",[-1,0,0,0,0,0,1,2,32,31,1,0,44,0,48,0,0,0,56,127,0,50,40,56,21,0,0,0,0,0,0]],["BASS3",[-1,0,0,0,0,0,0,1,2,84,1,127,31,0,0,0,0,0,50,127,0,9,106,0,19,0,0,0,0,0,0]],["BASS4",[-1,0,0,0,0,0,1,1,-2,62,0,17,78,0,42,0,0,9,39,127,0,21,37,60,21,0,0,0,0,0,5]],["BASS5",[-1,0,0,0,0,0,1,0,3,0,1,14,97,0,28,0,0,0,31,127,14,85,62,2,19,0,0,0,0,0,0]],["BASS6",[-1,0,0,0,-35,0,2,0,1,34,0,16,26,0,45,0,0,0,33,94,0,49,67,11,21,0,0,6,0,0,0]],["BASS7",[-1,0,21,0,0,0,1,2,0,0,0,21,110,0,23,14,0,0,127,91,0,73,58,12,21,0,0,0,0,1,0]],["LEAD1",[1,0,0,4,0,-2,1,1,5,62,0,44,26,0,36,0,0,0,25,106,1,49,52,48,85,0,1,0,2,0,0]],["LEAD2",[0,0,0,5,0,42,0,2,13,64,1,127,15,0,0,0,1,0,33,84,19,85,0,0,80,0,1,0,5,0,0]],["LEAD3",[1,0,0,0,0,4,2,2,40,0,0,94,0,0,35,0,0,32,0,84,0,74,23,78,77,0,0,0,1,0,6]],["LEAD4",[1,0,0,0,12,3,2,1,3,57,0,67,39,0,24,0,0,0,0,85,0,61,34,66,81,0,0,6,1,0,0]],["UFO",[2,32,0,0,0,36,3,0,0,126,0,57,48,0,48,0,0,0,62,102,0,84,21,85,115,1,0,0,3,0,0]],["THUNDR",[0,0,0,0,0,0,1,3,63,127,0,8,25,0,46,0,0,0,67,104,0,108,0,106,24,0,0,0,0,0,0]],["CPU 1",[1,0,0,44,0,0,2,0,0,0,0,127,0,0,0,0,0,0,0,62,0,127,0,0,110,1,4,0,0,0,0]],["PHONE",[0,0,0,25,0,0,0,2,50,127,0,68,81,1,0,0,0,0,1,85,0,60,98,0,104,0,3,0,0,0,0]],["KICK1",[-2,63,0,0,0,0,2,1,0,0,0,17,76,0,30,0,0,0,35,127,0,32,0,31,23,0,0,0,0,0,0]],["KICK2",[-2,63,0,0,0,0,2,1,0,0,0,17,67,0,29,0,0,0,127,127,0,23,31,39,19,0,0,0,0,0,0]],["SNARE1",[0,0,0,0,0,0,3,0,23,28,0,29,68,1,0,0,0,0,87,127,0,31,0,31,21,0,0,0,0,0,0]],["SNARE2",[0,23,0,27,0,0,3,0,16,13,0,57,0,0,36,0,0,21,77,127,0,42,0,42,127,0,1,0,0,0,5]],["SNARE3",[0,0,0,0,0,63,3,3,63,37,0,29,33,0,40,0,0,0,127,126,0,49,0,49,19,0,0,0,5,0,0]],["HIHAT",[2,0,0,0,0,0,3,3,63,0,0,127,0,1,0,0,0,0,0,127,0,19,0,21,21,0,0,0,0,0,0]],["TOM",[0,38,0,0,0,0,0,3,63,1,0,62,0,0,25,0,0,0,0,127,0,92,0,91,21,0,0,0,0,0,0]],["ZAP",[-2,63,0,63,0,0,2,0,-63,0,0,21,28,0,51,0,0,0,0,84,0,33,0,32,0,0,5,0,0,0,0]]];
const fac=n=>FACTORY.find(f=>f[0]===n)[1];
function facTrack(n,mix,nv){const k={};fac(n).forEach((v,i)=>k[i]=v);Object.assign(k,patch(mix||{}));return mkTrack(n,k,nv||1);}
function loadDemo(){
  S.tracks=[
    facTrack('BASS2',{vol:100}),
    facTrack('LEAD1',{vol:82,sa:46,sb:60}),
    facTrack('LEAD4',{vol:72,sa:64,pan:58},4),
    facTrack('KICK1',{vol:114}),
    facTrack('SNARE1',{vol:94,sa:30}),
    facTrack('HIHAT',{vol:70,pan:80},2),
    facTrack('LEAD3',{vol:66,pan:44,sb:56}),
    facTrack('ZAP',{vol:76,sa:60,sb:50})];
  S.tracks[1].ins[0]=mkFx('ds10',{type:0,time:70,fb:10,mix:40});
  S.tracks[2].ins[0]=mkFx('ds10',{type:1,lfo:40,depth:70,mix:80});
  S.tracks[6].ins[0]=mkFx('ds10',{type:2,lfo:30,depth:90,fb:30,mix:64});
  S.buses=[{name:'BUS A',ret:100,ins:[mkFx('mverb',{dev:2,prog:15,mix:127}),null]},{name:'BUS B',ret:96,ins:[mkFx('tape',{speed:42,fb:84,len:3,mix:127}),null]}];
  S.master={vol:127,shp:1,ins:[null,null]};
  S.parts=[];S.nextId=1;
  // BASS2 sits an octave down, LEAD1/LEAD3/LEAD4 an octave up; drums play at note 60 like the DS-10 drum part
  const bass=[],b1=[48,48,60,48,55,48,58,60],b2=[44,44,56,44,46,46,58,46];
  b1.forEach((p,i)=>bass.push({t:i*48,p,v:i%2?84:112,d:40}));
  b2.forEach((p,i)=>bass.push({t:BAR+i*48,p,v:i%2?84:112,d:40}));
  for(let b=0;b<8;b+=2)S.parts.push(mkPart(0,b,2,bass));
  const bass4=[...bass,...bass.map(n=>({...n,t:n.t+2*BAR}))];
  S.parts.push(mkPart(0,8,4,bass4),mkPart(0,12,4,bass4));
  const lead=[[60,0,2],[63,2,2],[67,4,4],[65,8,2],[63,10,2],[62,12,4],[60,16,6],[58,22,2],[55,24,8]].map(([p,s,l])=>({t:s*24,p,v:100,d:l*24-6}));
  [4,6,12,14].forEach(b=>S.parts.push(mkPart(1,b,2,lead)));
  const pads=[];for(let b=0;b<16;b++)(b%2?[48,51,56]:[48,51,55]).forEach(p=>pads.push({t:b*BAR,p,v:90,d:BAR-12}));
  const pp=mkPart(2,0,16,pads);
  pp.auto[11]={m:'s',pts:[{t:0,v:40},{t:4*BAR,v:70},{t:8*BAR,v:50},{t:12*BAR,v:90},{t:16*BAR-6,v:60}]};
  S.parts.push(pp);
  const kick=[],snare=[],hats=[];
  for(let b=0;b<2;b++){const o=b*BAR;
    kick.push({t:o,p:60,v:120,d:30},{t:o+192,p:60,v:110,d:30});snare.push({t:o+96,p:60,v:110,d:30},{t:o+288,p:60,v:115,d:30});
    for(let i=0;i<8;i++)hats.push(b===1&&i===7?{t:o+i*48,p:60,v:100,d:44}:{t:o+i*48,p:60,v:i%2?70:100,d:12});}
  kick.push({t:BAR+168,p:60,v:90,d:24});
  for(let b=0;b<16;b+=2){S.parts.push(mkPart(3,b,2,kick));if(b>=2)S.parts.push(mkPart(4,b,2,snare));S.parts.push(mkPart(5,b,2,hats));}
  const arp=[],seq=[0,1,2,3,2,1,0,1,2,3,2,1,0,2,1,3];
  for(let b=0;b<8;b++){const c=b%2?[48,51,56,60]:[48,51,55,60];seq.forEach((k,i)=>arp.push({t:b*BAR+i*24,p:c[k],v:i%4?70:96,d:18}));}
  const ap=mkPart(6,8,8,arp);ap.auto[12]={m:'h',pts:[0,1,2,3,4,5,6,7].map(i=>({t:i*BAR,v:[30,60,45,90,30,70,50,110][i]}))};
  S.parts.push(ap);
  S.parts.push(mkPart(7,8,1,[{t:0,p:60,v:110,d:90}]),mkPart(7,12,1,[{t:0,p:60,v:110,d:90}]),mkPart(7,15,1,[{t:288,p:60,v:110,d:90}]));
  S.L=0;S.R=BAR*8;S.cycle=false;S.tempo=120;S.sel=null;S.view='arr';S.editPart=null;S.active=0;undoStack.length=0;
  S.songName='demo';dirty=true;
}
function newSong(){
  snapshot();
  S.tracks=['Track 1','Track 2','Track 3','Track 4','Track 5','Track 6','Track 7','Track 8'].map(n=>mkTrack(n,{},1));
  S.buses=[{name:'BUS A',ret:100,ins:[mkFx('mverb',{mix:127}),null]},{name:'BUS B',ret:100,ins:[mkFx('tape',{mix:127}),null]}];
  S.master={vol:127,shp:1,ins:[null,null]};
  S.parts=[];S.sel=null;S.view='arr';S.editPart=null;S.pos=0;S.songName='untitled';
  sendCfg();songChanged();dirty=true;
}
function songObj(){
  return {app:'arranger-st',version:2,name:S.songName||'untitled',tempo:S.tempo,qi:S.qi,L:S.L,R:S.R,cycle:S.cycle,padX:S.padX,padY:S.padY,padMode:S.padMode,
    tracks:S.tracks.map(t=>({name:t.name,nv:t.nv,k:t.k.slice(),mute:t.mute,solo:t.solo,ins:t.ins})),
    buses:S.buses,master:S.master,
    parts:S.parts.map(p=>({id:p.id,track:p.track,start:p.start,len:p.len,name:p.name,mute:!!p.mute,notes:p.notes.map(n=>({t:n.t,p:n.p,v:n.v,d:n.d})),auto:p.auto||{}}))};
}
function cleanAuto(a){const o={};if(a&&typeof a==='object')for(const k in a){const id=+k,ln=a[k];if(id>=0&&id<NP&&ln&&Array.isArray(ln.pts))o[id]={m:ln.m==='h'?'h':'s',pts:ln.pts.filter(x=>x&&isFinite(x.t)&&isFinite(x.v)).map(x=>({t:x.t|0,v:clamp(Math.round(x.v),P[id][2],P[id][3])})).sort((a,b)=>a.t-b.t)};}return o;}
function loadSong(o){
  if(!o||!Array.isArray(o.tracks)||!Array.isArray(o.parts))throw new Error('Not an Arranger ST song');
  const fx=f=>f&&FXDEF[f.type]?{type:f.type,on:f.on!==false,p:Object.assign(mkFx(f.type).p,f.p||{})}:null;
  S.tracks=o.tracks.slice(0,8).map((t,i)=>{const tr=mkTrack(String(t.name||'Track '+(i+1)).slice(0,12),{},clamp(t.nv|0,1,8));
    (t.k||[]).forEach((v,j)=>{if(j<NP)tr.k[j]=clamp(Math.round(v),P[j][2],P[j][3]);});tr.lv=tr.k.slice();tr.mute=!!t.mute;tr.solo=!!t.solo;tr.ins=[fx((t.ins||[])[0]),fx((t.ins||[])[1])];return tr;});

const LOWER=['KeyZ','KeyS','KeyX','KeyD','KeyC','KeyV','KeyG','KeyB','KeyH','KeyN','KeyJ','KeyM','Comma'];
const UPPER=['KeyQ','Digit2','KeyW','Digit3','KeyE','KeyR','Digit5','KeyT','Digit6','KeyY','Digit7','KeyU','KeyI','Digit9','KeyO','Digit0','KeyP'];
const LOWLBL='Z S X D C V G B H N J M ,'.split(' '),UPLBL='Q 2 W 3 E R 5 T 6 Y 7 U I 9 O 0 P'.split(' ');
const base=()=>12*(S.oct+2);
function codeToNote(c){let i=LOWER.indexOf(c);if(i>=0)return base()+i;i=UPPER.indexOf(c);if(i>=0)return base()+12+i;return -1;}
const TOOLKEYS={KeyA:'pointer',KeyP:'pencil',KeyE:'eraser',KeyS:'scissors',KeyG:'glue',KeyM:'mute'};
const FKEYS={F1:'arr',F2:'edit',F3:'syn',F4:'mix',F5:'fx',F6:'pad'};
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  if(FKEYS[e.code]){e.preventDefault();setView(FKEYS[e.code]);return;}
  if(e.ctrlKey||e.metaKey){if(e.code==='KeyZ'){e.preventDefault();undo();}else if(e.code==='KeyS'){e.preventDefault();saveJSON();}return;}
  const c=e.code;
  if(S.qwerty&&!e.altKey){const n=codeToNote(c);if(n>=0){e.preventDefault();if(!e.repeat)noteOn('k:'+c,n,e.shiftKey?127:100);return;}}
  else if(!S.qwerty&&TOOLKEYS[c]){const t=TOOLKEYS[c];if(S.view==='arr'||TOOLS_EDIT.includes(t))setTool(t);return;}
  const handled=()=>e.preventDefault();
  if(S.dialog){if(c==='Enter'||c==='Escape'||c==='Space'){handled();S.dialog=null;dirty=true;}return;}
  switch(c){
    case 'Space':handled();if(e.repeat)return;if(S.step)stepAdvance();else togglePlay();break;
    case 'Enter':handled();if(!e.repeat)rec();break;
    case 'NumpadEnter':handled();play();break;
    case 'Numpad0':handled();stop();break;
    case 'NumpadMultiply':handled();rec();break;
    case 'Slash':case 'NumpadDivide':handled();toggleCycle();break;
    case 'Home':case 'NumpadDecimal':handled();rtz();break;
    case 'Escape':handled();if(S.menu!=null||S.toolbox||S.popup||S.presetPick){S.menu=null;S.toolbox=null;S.popup=null;S.presetPick=false;dirty=true;}else if(S.step)exitStep();else if(S.view!=='arr')toArr();break;
    case 'Tab':handled();nextTool(e.shiftKey?-1:1);break;
    case 'ArrowLeft':handled();relocate(Math.max(0,S.pos-(e.shiftKey?PPQ:BAR)));break;
    case 'ArrowRight':handled();relocate(S.pos+(e.shiftKey?PPQ:BAR));break;
    case 'ArrowUp':case 'ArrowDown':{handled();const d=c==='ArrowUp'?1:-1;
      if(S.view==='edit'){if(S.selNote){snapshot();S.selNote.p=clamp(S.selNote.p+d*(e.shiftKey?12:1),0,127);audition(S.selNote.p,S.selNote.v);}else S.editHi=clamp(S.editHi+d*2,23,127);}
      else setActive(S.active-d);dirty=true;break;}
    case 'BracketLeft':handled();setQ(S.qi-1);break;
    case 'BracketRight':handled();setQ(S.qi+1);break;
    case 'Minus':case 'NumpadSubtract':handled();octave(-1);break;
    case 'Equal':case 'NumpadAdd':handled();octave(1);break;
    case 'Delete':case 'Backspace':handled();if(S.step)stepBack();else del();break;
  }
});

      S.drag={move:(x2,y2,ev)=>{if(!started&&Math.abs(x2-ox)<3&&Math.abs(y2-oy)<3)return;
        if(!started){snapshot();started=true;if(copy){tg=clonePart(p);S.parts.push(tg);S.sel=tg.id;}}
        const g=ev.shiftKey?PPQ:BAR,dt=(x2-ox)/BARPX*BAR;
        if(edge)tg.len=Math.max(g,Math.round((ol+dt)/g)*g);
        else{tg.start=Math.max(0,os+Math.round(dt/g)*g);tg.track=clamp(ot+Math.round((y2-oy)/TRH),0,7);}},up:()=>{if(started)songChanged();}};
    }else{S.sel=null;if(dbl){snapshot();const np=mkPart(ti,Math.floor(tk/BAR),1,[]);S.parts.push(np);S.sel=np.id;}}
    return;}
  if(tool==='pencil'){const st=Math.floor(tk/BAR)*BAR;S.pencil={track:ti,start:st,end:st+BAR};
    S.drag={move:x2=>{S.pencil.end=Math.max(st+BAR,Math.ceil(xToTick(x2)/BAR)*BAR);},
      up:()=>{snapshot();const np={id:S.nextId++,track:ti,start:st,len:S.pencil.end-st,notes:[],mute:false,name:S.tracks[ti].name,auto:{}};S.parts.push(np);S.sel=np.id;S.active=ti;S.pencil=null;}};return;}
  if(tool==='eraser'){let snap=false;const er=(x2,y2)=>{const t2=Math.floor((y2-TRY)/TRH),pp=partAtTick(t2,xToTick(x2));if(pp){if(!snap){snapshot();snap=true;}S.parts=S.parts.filter(o=>o!==pp);if(S.sel===pp.id)S.sel=null;}};er(x,y);S.drag={move:er};return;}
  if(!p)return;
  if(tool==='scissors'){const at=Math.round(tk/q())*q();if(at>p.start&&at<p.start+p.len){snapshot();split(p,at);}}
  else if(tool==='glue'){snapshot();glue(p);}
  else if(tool==='mute'){snapshot();p.mute=!p.mute;}
}
function editDown(x,y,e,dbl){
  const p=part(S.editPart);if(!p)return;const ppt=editPpt();
  if(y>=38&&y<56&&x>=GX){const set=x2=>relocate(p.start+clamp(Math.floor((x2-GX)/ppt/q())*q(),0,p.len));set(x);S.drag={move:set};
    if(S.step){S.stepPos=clamp(Math.floor((x-GX)/ppt/q())*q(),0,p.len-1);}return;}
  if(x<GX&&y>=GY&&y<GY+NH*NROWS){const pitch=S.editHi-Math.floor((y-GY)/NH);noteOn('ptr',pitch,100);S.drag={up:()=>noteOff('ptr')};return;}
  if(x<GX&&y>=VY-2&&y<TBY){
    if(y<VY+19){const L=laneList(p);S.lane=L[(L.indexOf(String(S.lane))+1)%L.length];}
    else if(S.lane!=='vel'){snapshot();const ln=p.auto[S.lane];if(ln)ln.m=ln.m==='h'?'s':'h';else S.padMode=S.padMode==='h'?'s':'h';}
    return;}
  if(y>=VY-2&&y<TBY&&x>=GX){
    let snap=false;
    if(S.lane==='vel'){
      const setV=(x2,y2)=>{const v=clamp(Math.round((VY+VH-y2)/VH*127),1,127);for(const n of p.notes){const nx=Math.round(GX+n.t*ppt);if(Math.abs(nx-x2)<=3){if(!snap){snapshot();snap=true;}n.v=v;}}};
      setV(x,y);S.drag={move:setV};return;}
    const id=+S.lane,mn=P[id][2],mx=P[id][3];
    const ln=()=>p.auto[id]||(p.auto[id]={m:S.padMode,pts:[]});
    if(S.tool==='eraser'){const er=x2=>{const L=p.auto[id];if(!L)return;const t=(x2-GX)/ppt;const before=L.pts.length;L.pts=L.pts.filter(pt=>Math.abs(pt.t-t)>q()/2);if(L.pts.length!==before&&!snap){snap=true;}};snapshot();er(x);S.drag={move:er};return;}
    snapshot();let lastT=null;
    const setA=(x2,y2)=>{const t=clamp(Math.floor((x2-GX)/ppt/q())*q(),0,p.len-1),v=clamp(Math.round(mn+(VY+VH-1-y2)/(VH-2)*(mx-mn)),mn,mx);
      const L=ln();const lo=lastT==null?t:Math.min(lastT,t),hi=lastT==null?t:Math.max(lastT,t);
      L.pts=L.pts.filter(pt=>pt.t<lo||pt.t>hi);
      if(lastT!=null&&lastT!==t){const lv=L._lv;for(let tt=lo;tt<=hi;tt+=q()){const f=(tt-lastT)/(t-lastT);L.pts.push({t:tt,v:Math.round(lv+(v-lv)*f)});}}
      else L.pts.push({t,v});
      L.pts.sort((a,b)=>a.t-b.t);L._lv=v;lastT=t;};
    setA(x,y);S.drag={move:setA,up:()=>{const L=p.auto[id];if(L)delete L._lv;songChanged();}};return;
  }
  if(!(x>=GX&&y>=GY&&y<GY+NH*NROWS))return;
  const tk=(x-GX)/ppt,pitch=S.editHi-Math.floor((y-GY)/NH),n=noteAtXY(x,y),tool=S.tool;
  if(tool==='eraser'){let snap=false;const er=(x2,y2)=>{const nn=noteAtXY(x2,y2);if(nn){if(!snap){snapshot();snap=true;}p.notes=p.notes.filter(o=>o!==nn);if(S.selNote===nn)S.selNote=null;}};er(x,y);S.drag={move:er};return;}
  if(n){S.selNote=n;audition(n.p,n.v);
    const edge=tool==='pencil'||x>=noteRight(n)-3,ox=x,oy=y,ot=n.t,op=n.p,od=n.d;let started=false;
    S.drag={move:(x2,y2,ev)=>{if(!started&&Math.abs(x2-ox)<3&&Math.abs(y2-oy)<3)return;if(!started){snapshot();started=true;}
      const g=ev.shiftKey?1:q(),dt=(x2-ox)/ppt;
      if(edge)n.d=Math.max(Math.min(g,q()),Math.round((od+dt)/g)*g);
      else{n.t=clamp(Math.round((ot+dt)/g)*g,0,p.len-1);const np=clamp(op-Math.round((y2-oy)/NH),0,127);if(np!==n.p){n.p=np;audition(np,n.v);}}}};
    return;}
  S.selNote=null;
  if(tool==='pencil'||dbl){snapshot();const st=clamp(Math.floor(tk/q())*q(),0,p.len-1);const nn={t:st,p:pitch,v:100,d:q()};p.notes.push(nn);S.selNote=nn;audition(pitch,100);
    S.drag={move:x2=>{nn.d=Math.max(q(),Math.ceil(((x2-GX)/ppt-st)/q())*q());}};}
}

/* ---------- hints ---------- */
function canvasHint(x,y){
  if(S.dialog)return ['Alert box','Click OK or press Enter.','Enter'];
  if(S.toolbox)return ['Toolbox','Release the right button over a tool, or click one. Esc closes.','Tab'];
  if(S.popup)return ['Menu','Click an item.','Esc'];
  if(y<19){const tb=tabGeom().find(t=>x>=t.x&&x<t.x+t.w);if(tb)return [VIEWNAME[tb.v]+' window','Click to switch windows.',tb.k];return ['Menu bar','Click a title to open its menu; slide across to switch menus.',''];}
  if(S.menu!=null)return ['Menu','Click an item. Shortcuts are shown on the right.',''];
  const r=regionAt(x,y);if(r&&r.hint)return r.hint;
  if(y<38)return ['Window title','The open window.',''];
  if(S.view==='arr'){
    if(y<44&&x>=TLX)return ['Cycle strip','Drag across bars to set the L–R cycle range. Click to toggle cycle.','/'];
    if(y<56&&x>=TLX)return ['Ruler','Click or drag to set the song position. Shift snaps to beats.','← →'];
    if(y<56)return ['Track columns','A active, M mute, S solo, V voices (m is mono).',''];
    if(x<TLX){if(x>=14&&x<27)return ['Mute','Click to silence this track.',''];if(x>=29&&x<42)return ['Solo','Click to hear only soloed tracks.',''];
      if(x>=45&&x<60)return ['Voices','Click to cycle mono, 2, 3, 4, 6 or 8 voices.',''];
      return ['Track list','Click to make a track active; double-click to open its synth. Scroll to step through tracks.','↑ ↓'];}
    const tl={pointer:['Pointer','Drag a part to move it, drag its right edge to resize, Alt-drag to copy, double-click to open Key Edit. Double-click an empty lane to add a part.'],
      pencil:['Pencil','Drag across an empty lane to draw a part of that many bars.'],eraser:['Eraser','Click or drag across parts to delete them.'],
      scissors:['Scissors','Click a part to split it at the dotted line.'],glue:['Glue','Click a part to join it with the next part on the same track.'],mute:['Mute tool','Click a part to mute or unmute it.']}[S.tool];
    return [tl[0],tl[1]+' Right-press to switch tools. A small box on a part means it has automation.','Tab'];
  }
  if(S.view==='edit'){
    if(y<56)return x<GX?['Pitch readout','Shows the pitch under the pointer.','']:['Ruler','Click to set the song position inside this part.',''];
    if(x<GX&&y<GY+NH*NROWS)return ['Keyboard','Click a key to hear the pitch on this track.',''];
    if(x<GX&&y>=VY-2)return ['Lane','Click the name to switch between velocity and this part\'s automation lanes; scroll it to pick any knob. The box below switches smooth or hold.',''];
    if(y>=VY-2&&y<TBY)return S.lane==='vel'?['Velocity lane','Drag across the bars to draw velocities.','']:['Automation lane: '+P[+S.lane][1],'Drag to draw values on the quantize grid. The eraser removes points. The dotted line is the patch value.',''];
    const tl={pointer:['Pointer','Drag notes to move them, drag the right end to resize, double-click empty grid to add a note.'],
      pencil:['Pencil','Click to draw a note one quantize step long; drag to stretch it.'],eraser:['Eraser','Click or drag over notes to delete them.']}[S.tool]||['',''];
    return [tl[0],tl[1]+(S.step?' Step input is on: play notes to enter them, Space for a rest, Backspace to step back.':' Enter while stopped starts step input.'),'Tab'];
  }
  return ['',''];
}

/* ---------- KAOSS pad window ---------- */
const PADR={x:8,y:62,w:400,h:268};
function padTarget(axis,d){const k=axis==='x'?'padX':'padY';S[k]=(S[k]+d+NP)%NP;songChanged();dirty=true;}
function padApply(fx,fy){
  S.padVX=fx;S.padVY=fy;const ti=inputTrack();
  for(const [id,f] of [[S.padX,fx],[S.padY,fy]]){const p=P[id];setParam(ti,id,p[2]+f*(p[3]-p[2]),false);}
}
const padAt=(x,y)=>padApply(clamp((x-PADR.x)/PADR.w,0,1),clamp(1-(y-PADR.y)/PADR.h,0,1));
function padDown(x,y){ensureAudio();S.padOn=true;padAt(x,y);S.drag={move:(x2,y2)=>padAt(x2,y2),up:padUp};}
function padUp(){
  S.padOn=false;const ti=inputTrack();recRelease(ti,[S.padX,S.padY]);
  for(const id of [S.padX,S.padY]){const t=S.tracks[ti];if(t.lv[id]!==t.k[id]&&!(S.playing&&hasLane(ti,id))){t.lv[id]=t.k[id];post({t:'ev',ev:[{time:0,k:'knob',tr:ti,id,v:t.k[id]}]});}}
  dirty=true;
}
function hasLane(ti,id){return S.parts.some(p=>p.track===ti&&p.auto&&p.auto[id]&&p.auto[id].pts.length);}
function drawPad(){
  const ti=inputTrack(),t=S.tracks[ti],R=PADR;
  clr(0,38,W,TBY-38,WH);
  clr(0,38,W,18,WH);hl(0,55,W);
  box(4,40,16,14);T('<',12,47,B,'center');reg(4,40,16,14,{down:()=>setActive(ti-1),hint:['Previous track','The pad controls the active track.','↑']});
  box(22,40,16,14);T('>',30,47,B,'center');reg(22,40,16,14,{down:()=>setActive(ti+1),hint:['Next track','','↓']});
  T('T'+(ti+1)+' '+t.name.toUpperCase(),44,47);
  if(S.rec&&S.playing){clr(W-212,40,208,14,B);T('RECORDING AUTOMATION',W-108,47,WH,'center');}
  else T('Record + play to write moves',W-8,47,B,'right');
  box(R.x-1,R.y-1,R.w+2,R.h+2);
  for(let i=1;i<8;i++){dotV(R.x+Math.round(i*R.w/8),R.y,R.h,4);dotH(R.x,R.y+Math.round(i*R.h/8),R.w,4);}
  const vx=(t.lv[S.padX]-P[S.padX][2])/(P[S.padX][3]-P[S.padX][2]),vy=(t.lv[S.padY]-P[S.padY][2])/(P[S.padY][3]-P[S.padY][2]);
  const px=Math.round(R.x+vx*R.w),py=Math.round(R.y+(1-vy)*R.h);
  if(S.padOn){vl(px,R.y,R.h);hl(R.x,py,R.w);clr(px-5,py-5,11,11,B);}
  else{box(px-5,py-5,11,11);}
  clr(R.x+1,R.y+R.h-15,tw('X '+P[S.padX][1])+8,14,B);T('X '+P[S.padX][1],R.x+5,R.y+R.h-8,WH);
  clr(R.x+1,R.y+1,tw('Y '+P[S.padY][1])+8,14,B);T('Y '+P[S.padY][1],R.x+5,R.y+8,WH);
  reg(R.x,R.y,R.w,R.h,{pad:true,cur:'cross',hint:['KAOSS pad','Drag to move the X and Y knobs of the active track. Releasing returns them to the patch values. With Record on during playback the moves become automation.','']});
  const x0=424,cw=W-x0-8;
  const axis=(ax,y)=>{const id=ax==='x'?S.padX:S.padY;
    T(ax.toUpperCase()+' AXIS',x0,y);
    box(x0,y+8,16,18);T('<',x0+8,y+17,B,'center');box(x0+cw-16,y+8,16,18);T('>',x0+cw-8,y+17,B,'center');
    box(x0+18,y+8,cw-36,18);T(P[id][1].slice(0,20),x0+cw/2,y+17,B,'center');
    T('value '+pfmt(id,t.lv[id])+'   patch '+pfmt(id,t.k[id]),x0,y+36);
    const h=['Pad '+ax.toUpperCase()+' target','Click the arrows or the name to pick the knob this axis moves; scroll to step through.',''];
    reg(x0,y+8,16,18,{down:()=>padTarget(ax,-1),hint:h});reg(x0+cw-16,y+8,16,18,{down:()=>padTarget(ax,1),hint:h});
    reg(x0+18,y+8,cw-36,18,{down:e=>padTarget(ax,e.shiftKey?-1:1),wheel:d=>padTarget(ax,d),hint:h});};
  axis('x',70);axis('y',130);
  T('CURVE',x0,198);
  [['SMOOTH','s'],['HOLD','h']].forEach(([l,m],i)=>{const bx=x0+i*(cw/2),on=S.padMode===m;box(bx,206,cw/2-2,18,on?B:WH);T(l,bx+cw/4-1,215,on?WH:B,'center');
    reg(bx,206,cw/2-2,18,{down:()=>{S.padMode=m;songChanged();dirty=true;},hint:['Automation curve','SMOOTH draws a line between recorded points; HOLD keeps each value until the next, for stepped sequences. Applies to lanes recorded from now on.','']});});
  T('Recorded lanes show',x0,250);T('in Key Edit under the',x0,266);T('note grid (F2).',x0,282);
}

/* ---------- status line ---------- */
const hT=$('#hintT'),hD=$('#hintD'),hK=$('#hintK');
let lastHint='',msgUntil=0;
function showHint(t,d,k){if(performance.now()<msgUntil)return;const key=t+d+k;if(key===lastHint)return;lastHint=key;hT.textContent=t||'ARRANGER ST';hD.textContent=d;hK.textContent=k||'';hK.hidden=!k;}
function flashMsg(s){msgUntil=performance.now()+2400;lastHint='';hT.textContent='NOTE';hD.textContent=s;hK.hidden=true;}

/* ---------- on-screen keyboard ---------- */
const kb=$('#kb');let kbKeys={};
function buildKb(){
  kb.innerHTML='';kbKeys={};const b=base(),n=30;let wi=0;const whites=[];
  for(let i=0;i<n;i++)if(!isBlack(b+i))whites.push(i);
  const ww=100/whites.length;
  for(let i=0;i<n;i++){const p=b+i,el=document.createElement('div'),black=isBlack(p);
    const lbl=i<13?LOWLBL[i]:(i-12<UPLBL.length?UPLBL[i-12]:'');
    if(!black){el.className='w';el.style.left=(wi*ww)+'%';el.style.width=ww+'%';wi++;}
    else{el.className='k';el.style.left=(wi*ww-ww*0.3)+'%';el.style.width=(ww*0.6)+'%';}
    el.innerHTML=(lbl?`<span>${lbl}</span>`:'')+(p%12===0?`<small>${nname(p)}</small>`:'');
    el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);noteOn('s:'+p,p,100);});
    const off=()=>noteOff('s:'+p);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);
    kb.appendChild(el);kbKeys[p]=el;}
}
function kbLight(p,on){const el=kbKeys[p];if(el)el.classList.toggle('on',on);}
kb.addEventListener('pointerenter',()=>showHint('On-screen keys','Click to play the active track. Labels show the computer key for each note; physical positions, so QWERTZ and AZERTY work the same.','- ='));

/* ---------- loop & layout ---------- */
const statusEl=$('#status');
let scaleMode='auto';try{scaleMode=localStorage.getItem('arranger-st.scale2')||'auto';}catch(e){}
function fit(){
  const dpr=window.devicePixelRatio||1,aw=window.innerWidth-32;
  const fw=Math.max(1,Math.min(aw/640,(window.innerHeight-20)/500));
  let k;
  if(scaleMode==='1'||scaleMode==='2'||scaleMode==='3')k=(+scaleMode)*dpr;   // fixed size; the page scrolls if it does not fit
  else{
    const ah=window.innerHeight-20-Math.round(26*fw)-(S.showKb?Math.round(74*fw):0);
    k=Math.min(aw/640,ah/400)*dpr;
    if(scaleMode==='auto'&&k>=1)k=Math.floor(k);                     // whole device pixels per screen pixel
    k=Math.max(0.3*dpr,k);
  }
  cv.width=Math.round(640*k);cv.height=Math.round(400*k);K=cv.width/W;
  const w=cv.width/dpr,h=cv.height/dpr,f=clamp(w/640*0.75,1,2.4);
  document.documentElement.style.setProperty('--u',f.toFixed(3));
  document.body.style.overflow=w>window.innerWidth||h+100*f>window.innerHeight?'auto':'hidden';
  cv.style.width=w+'px';cv.style.height=h+'px';statusEl.style.width=w+'px';kb.style.width=w+'px';kb.hidden=!S.showKb;dirty=true;
}
function setScale(m){scaleMode=m;try{localStorage.setItem('arranger-st.scale2',m);}catch(e){}fit();}
window.addEventListener('resize',fit);
document.addEventListener('pointerdown',()=>ensureAudio(),{once:true});

function frame(){
  if(S.playing&&ac){
    const cur=curTick();
    if(S.rec){if(S.recMode==='replace')eraseReplace(prevTick,cur);for(const h of held.values())if(h.rn)h.rn.n.d=recLen(h.rn);
      if(S.padOn){const ti=inputTrack();for(const [id,f] of [[S.padX,S.padVX],[S.padY,S.padVY]]){const p=P[id];recAuto(ti,id,Math.round(p[2]+f*(p[3]-p[2])));}}}
    prevTick=cur;S.pos=cur;
    if(!cycOn()&&cur>=NBARS*BAR){stop();S.pos=0;}
    if(S.view==='arr'){const bar=Math.floor(cur/BAR);if(bar>=S.scroll+VIS||bar<S.scroll)S.scroll=clamp(bar,0,NBARS-VIS);}
    const now=ac.currentTime;while(liveQ.length&&liveQ[0].at<=now){const u=liveQ.shift();if(!autoHeld.has(u.tr+':'+u.id))S.tracks[u.tr].lv[u.id]=u.v;}
    liveQ.sort((a,b)=>a.at-b.at);
    dirty=true;
  }
  if(gate.some(g=>g>0)||S.step||held.size||performance.now()-S.inFlash<500||meters.l>0.001)dirty=true;
  meters.l*=0.97;meters.r*=0.97;for(let i=0;i<8;i++)meters.tr[i]*=0.97;
  if(dirty){dirty=false;render();}
  requestAnimationFrame(frame);
}
window.__ast={S,get ac(){return ac},get ready(){return ready},meters};
(function boot(){
  let ok=false;
  try{const s=localStorage.getItem(LS_KEY);if(s){loadSong(JSON.parse(s));ok=true;}}catch(e){ok=false;}
  if(!ok)loadDemo();
  buildKb();fit();
  (document.fonts?document.fonts.load('16px VT323'):Promise.resolve()).catch(()=>{}).then(()=>{dirty=true;requestAnimationFrame(frame);});
})();
})();
</script>
