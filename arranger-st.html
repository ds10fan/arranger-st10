const NP=P.length,NA=NP+16,INIT_K=P.map(p=>p[4]).concat(new Array(16).fill(0));
/* ids NP..NA-1 are the knobs of a track's two insert slots: NP + slot*8 + n, n in the effect's own control order.
   PD() describes any id for a given track, so lanes, the pad and recording treat them like synth knobs. */
function PD(ti,id){
  if(id<NP)return P[id];
  const slot=(id-NP)>>3,j=(id-NP)&7,fx=S.tracks[ti]&&S.tracks[ti].ins[slot],d=fx&&FXDEF[fx.type],pp=d&&d.p[j];
  if(!pp)return ['—','INS'+(slot+1)+' —',0,127,0,null,true];
  return [pp[1].slice(0,7),'INS'+(slot+1)+' '+d.short+' '+pp[1],pp[2],pp[0]==='prog'?progMax(fx):pp[3],pp[4],pp[5]];
}
function pfmtT(ti,id,v){if(id<NP)return pfmt(id,v);const d=PD(ti,id);if(d[5])return d[5][v]??String(v);return d[2]<0&&v>0?'+'+v:String(v);}
function fxId(slot,key,fx){return NP+slot*8+FXDEF[fx.type].p.findIndex(x=>x[0]===key);}
function syncFx(t){for(let s=0;s<2;s++)for(let j=0;j<8;j++){const fx=t.ins[s],pp=fx&&FXDEF[fx.type].p[j],v=pp?fx.p[pp[0]]:0;t.k[NP+s*8+j]=v;t.lv[NP+s*8+j]=v;}}
const pfmt=(id,v)=>{const p=P[id];if(p[5])return p[5][v]??String(v);if(id===34)return v===64?'C':v<64?'L'+(64-v):'R'+(v-64);if(p[2]<0&&v>0)return '+'+v;return String(v);};

  if(c==='KeyA'){S.selSet=new Set(p.notes);S.selNote=p.notes[0]||null;}
  else if(c==='KeyC'||c==='KeyX'){const L=selList();if(!L.length)return flashMsg('Select notes first');const t0=Math.min(...L.map(n=>n.t));
    noteClip=L.map(n=>({t:n.t-t0,p:n.p,v:n.v,d:n.d}));if(c==='KeyX'){snapshot();p.notes=p.notes.filter(n=>!isSel(n));selOnly(null);}flashMsg((c==='KeyX'?'Cut ':'Copied ')+L.length+' notes');}
  else if(c==='KeyV'){if(!noteClip)return flashMsg('Copy notes first');snapshot();
    const at=clamp(Math.round((S.pos-p.start)/q())*q(),0,p.len-1),add=noteClip.filter(n=>at+n.t<p.len).map(n=>({...n,t:at+n.t}));
    p.notes.push(...add);S.selSet=new Set(add);S.selNote=add[0]||null;flashMsg('Pasted '+add.length+' notes at the song position');}
  songChanged();dirty=true;
}
function toArr(){setView('arr');selOnly(null);}
function enterStep(){const p=part(S.editPart);if(!p)return;snapshot();S.step=true;S.stepHeld=0;
  const rel=S.pos-p.start;S.stepPos=(rel>=0&&rel<p.len)?Math.floor(rel/stepSize())*stepSize():0;dirty=true;}
function exitStep(){S.step=false;dirty=true;}
function stepAdvance(){const p=part(S.editPart);if(!p)return;S.stepPos+=stepSize();if(S.stepPos>=p.len)p.len+=BAR;S.pos=p.start+S.stepPos;dirty=true;}
function stepBack(){const p=part(S.editPart);if(!p)return;S.stepPos=Math.max(0,S.stepPos-stepSize());p.notes=p.notes.filter(n=>n.t!==S.stepPos);S.pos=p.start+S.stepPos;dirty=true;}

/* ---------- note input ---------- */
const held=new Map();
function inputTrack(){if(S.view==='edit'){const p=part(S.editPart);if(p)return p.track;}return S.active;}
function noteOn(key,p,v){
  if(held.has(key)||p<0||p>127)return;
  ensureAudio();
  const tr=inputTrack();
  post({t:'ev',ev:[{time:0,k:'on',tr,p,v}]});
  gate[tr]++;S.lastIn={p,v};S.inFlash=performance.now();
  let rn=null;
  if(S.playing&&S.rec)rn=recordStart(tr,p,v);
  else if(S.step&&S.view==='edit'){const pt=part(S.editPart);if(pt){pt.notes.push({t:S.stepPos,p,v,d:gateLen()||q()});S.stepHeld++;}}
  held.set(key,{p,rn,tr,step:S.step});
  kbLight(p,true);dirty=true;
}
function noteOff(key){
  const h=held.get(key);if(!h)return;held.delete(key);
  post({t:'ev',ev:[{time:0,k:'off',tr:h.tr,p:h.p}]});
  gate[h.tr]=Math.max(0,gate[h.tr]-1);
  if(h.rn)finalizeRec(h.rn);
  if(h.step&&S.step){S.stepHeld=Math.max(0,S.stepHeld-1);if(S.stepHeld===0)stepAdvance();}
  kbLight(h.p,[...held.values()].some(x=>x.p===h.p));dirty=true;
}
function allOff(){[...held.keys()].forEach(noteOff);}
function recPartAt(tr,st){
  let pt=S.parts.find(x=>x.track===tr&&!x.mute&&st>=x.start&&st<x.start+x.len);
  if(!pt){
    const bs=Math.floor(st/BAR)*BAR;
    pt=S.parts.find(x=>x.track===tr&&x.take===S.takeId&&x.start+x.len===bs);
    if(pt)pt.len+=BAR;
    else{pt={id:S.nextId++,track:tr,start:bs,len:BAR,notes:[],mute:false,name:S.tracks[tr].name+' rec',take:S.takeId,auto:{}};S.parts.push(pt);}
  }
  return pt;
}
function recordStart(tr,p,v){
  const raw=curTick();let st=raw;
  if(S.autoQ)st=Math.round(raw/q())*q();
  if(cycOn()&&st>=S.R)st=S.L;
  const pt=recPartAt(tr,st);
  const n={t:st-pt.start,p,v,d:6,take:S.takeId,fresh:curPass()};pt.notes.push(n);
  return {n,raw};
}
function recLen(rn){let d=curTick()-rn.raw;if(d<0)d+=S.R-S.L;return Math.max(6,Math.round(d));}
function finalizeRec(rn){rn.n.d=recLen(rn);songChanged();}
function finalizeHeld(){for(const h of held.values())if(h.rn){finalizeRec(h.rn);h.rn=null;}}
function eraseReplace(a,b){
  const tr=S.active;
  const kill=(x,y)=>{for(const p of partsOn(tr))p.notes=p.notes.filter(n=>{const abs=p.start+n.t;return n.take===S.takeId||abs<x||abs>=y;});};
  if(b>=a)kill(a,b);else{kill(a,S.R);kill(S.L,b);}
}
/* automation recording: the move overwrites the lane from where the previous point was written */
const recLast={};
function recAuto(tr,id,v){
  const tk=curTick();const pt=recPartAt(tr,tk);
  pt.auto=pt.auto||{};
  const rel=clamp(Math.round((tk-pt.start)/6)*6,0,pt.len-1);
  const ln=pt.auto[id]||(pt.auto[id]={m:S.padMode,pts:[]});
  const key=tr+':'+id,last=recLast[key];
  if(last&&last.part===pt.id&&rel>=last.t)ln.pts=ln.pts.filter(x=>x.t<=last.t||x.t>rel);
  else ln.pts=ln.pts.filter(x=>x.t!==rel);
  ln.pts.push({t:rel,v});ln.pts.sort((a,b)=>a.t-b.t);
  recLast[key]={part:pt.id,t:rel};autoHeld.add(key);songChanged();
}
function recRelease(tr,ids){for(const id of ids){const key=tr+':'+id;delete recLast[key];autoHeld.delete(key);}}

/* keyboard */
const LOWER=['KeyZ','KeyS','KeyX','KeyD','KeyC','KeyV','KeyG','KeyB','KeyH','KeyN','KeyJ','KeyM','Comma'];
const UPPER=['KeyQ','Digit2','KeyW','Digit3','KeyE','KeyR','Digit5','KeyT','Digit6','KeyY','Digit7','KeyU','KeyI','Digit9','KeyO','Digit0','KeyP'];
const LOWLBL='Z S X D C V G B H N J M ,'.split(' '),UPLBL='Q 2 W 3 E R 5 T 6 Y 7 U I 9 O 0 P'.split(' ');
const base=()=>12*(S.oct+2);
function codeToNote(c){let i=LOWER.indexOf(c);if(i>=0)return base()+i;i=UPPER.indexOf(c);if(i>=0)return base()+12+i;return -1;}
const TOOLKEYS={KeyA:'pointer',KeyP:'pencil',KeyE:'eraser',KeyS:'scissors',KeyG:'glue',KeyM:'mute'};
const FKEYS={F1:'arr',F2:'edit',F3:'syn',F4:'mix',F5:'fx',F6:'pad'};
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  if(S.input){e.preventDefault();const I=S.input;
    if(e.key==='Enter')inputDone(true);else if(e.key==='Escape')inputDone(false);
    else if(e.key==='Backspace')I.value=I.value.slice(0,-1);
    else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&I.value.length<I.max&&/^[\x20-\x7e]$/.test(e.key))I.value+=e.key;
    dirty=true;return;}
  if(e.code==='F9'){e.preventDefault();setView('man');return;}
  if(S.view==='man'&&['ArrowUp','ArrowDown','PageUp','PageDown','Home','End'].includes(e.code)){e.preventDefault();
    const pg=MAN_VIS-2;S.manTop+=({ArrowUp:-1,ArrowDown:1,PageUp:-pg,PageDown:pg,Home:-1e9,End:1e9})[e.code];dirty=true;return;}
  if(FKEYS[e.code]){e.preventDefault();setView(FKEYS[e.code]);return;}
  if(e.ctrlKey||e.metaKey){
    if(e.code==='KeyZ'){e.preventDefault();undo();}else if(e.code==='KeyS'){e.preventDefault();saveJSON();}
    else if(S.view==='edit'&&['KeyA','KeyC','KeyX','KeyV'].includes(e.code)){e.preventDefault();noteCmd(e.code);}
    return;}
  const c=e.code;
  if(S.qwerty&&!e.altKey){const n=codeToNote(c);if(n>=0){e.preventDefault();if(!e.repeat)noteOn('k:'+c,n,e.shiftKey?127:100);return;}}
  else if(!S.qwerty&&TOOLKEYS[c]){const t=TOOLKEYS[c];if(S.view==='arr'||TOOLS_EDIT.includes(t))setTool(t);return;}
  const handled=()=>e.preventDefault();
  if(S.dialog){if(c==='Enter'||c==='NumpadEnter'){handled();dialogAnswer(S.dialog.buttons.find(o=>o.def));}else if(c==='Escape'){handled();dialogAnswer(null);}return;}
  switch(c){
    case 'Space':handled();if(e.repeat)return;if(S.step)stepAdvance();else togglePlay();break;
    case 'Enter':handled();if(!e.repeat)rec();break;
    case 'NumpadEnter':handled();play();break;
    case 'Numpad0':handled();stop();break;
    case 'NumpadMultiply':handled();rec();break;
    case 'Slash':case 'NumpadDivide':handled();toggleCycle();break;
    case 'Home':case 'NumpadDecimal':handled();rtz();break;
    case 'Escape':handled();if(S.menu!=null||S.toolbox||S.popup||S.presetPick){S.menu=null;S.toolbox=null;S.popup=null;S.presetPick=false;dirty=true;}else if(S.step)exitStep();else if(S.view!=='arr')toArr();break;
    case 'Tab':handled();nextTool(e.shiftKey?-1:1);break;
    case 'Backquote':handled();S.gate=((S.gate||0)+(e.shiftKey?GATES.length-1:1))%GATES.length;if(S.gate&&S.selSet.size&&S.view==='edit'){snapshot();for(const m of S.selSet)m.d=gateLen();}flashMsg('Gate '+GATES[S.gate][0]);dirty=true;break;
    case 'ArrowLeft':handled();relocate(Math.max(0,S.pos-(e.shiftKey?PPQ:BAR)));break;
    case 'ArrowRight':handled();relocate(S.pos+(e.shiftKey?PPQ:BAR));break;
    case 'ArrowUp':case 'ArrowDown':{handled();const d=c==='ArrowUp'?1:-1;
      if(S.view==='edit'){if(S.selSet.size){snapshot();for(const m of S.selSet)m.p=clamp(m.p+d*(e.shiftKey?12:1),0,127);const a=S.selNote||selList()[0];audition(a.p,a.v);}else S.editHi=clamp(S.editHi+d*2,23,127);}
      else setActive(S.active-d);dirty=true;break;}
    case 'BracketLeft':handled();setQ(S.qi-1);break;
    case 'BracketRight':handled();setQ(S.qi+1);break;
    case 'Minus':case 'NumpadSubtract':handled();octave(-1);break;
    case 'Equal':case 'NumpadAdd':handled();octave(1);break;
    case 'Delete':case 'Backspace':handled();if(S.step)stepBack();else if(S.view==='edit'&&S.lane!=='vel'&&S.ptSel.size){const p=part(S.editPart),L=p&&p.auto[S.lane];if(L){snapshot();L.pts=L.pts.filter(pt=>!S.ptSel.has(pt));S.ptSel=new Set();songChanged();dirty=true;}}else del();break;
  }
});
document.addEventListener('keyup',e=>{if(held.has('k:'+e.code))noteOff('k:'+e.code);});
window.addEventListener('blur',allOff);
function octave(d){S.oct=clamp(S.oct+d,-1,6);allOff();buildKb();dirty=true;}
function audition(p,v){ensureAudio();const tr=inputTrack();post({t:'ev',ev:[{time:0,k:'on',tr,p,v:v||100},{time:(ac?ac.currentTime:0)+0.25,k:'off',tr,p}]});}

/* MIDI */
let midiAcc=null;
async function toggleMidi(){
  if(S.midi){S.midi=false;if(midiAcc)for(const i of midiAcc.inputs.values())i.onmidimessage=null;dirty=true;return;}
  if(!navigator.requestMIDIAccess)return dialog(['This browser has no Web MIDI.','Use Chromium, or keep playing','with the computer keyboard.']);
  try{
    midiAcc=await navigator.requestMIDIAccess();
    const hook=()=>{for(const i of midiAcc.inputs.values())i.onmidimessage=onMidi;};hook();midiAcc.onstatechange=hook;
    S.midi=true;const n=[...midiAcc.inputs.values()].map(i=>i.name);
    dialog(n.length?['MIDI input ready.',...n.slice(0,3)]:['MIDI is on, but no keyboard','is connected yet. Plug one in.']);
  }catch(err){dialog(['Web MIDI is blocked here.','The artifact viewer does not allow','MIDI devices. Open the HTML file','locally in Chromium, or keep','playing with the computer keyboard.']);}
  dirty=true;
}
function onMidi(e){const [st,d1,d2]=e.data;const cmd=st&0xf0;
  if(cmd===0x90&&d2>0)noteOn('m:'+d1,d1,d2);else if(cmd===0x80||(cmd===0x90&&d2===0))noteOff('m:'+d1);}

/* ---------- drawing primitives ---------- */
const cv=$('#screen'),ctx=cv.getContext('2d',{willReadFrequently:true});
function mkPat(rows){const c=document.createElement('canvas');c.width=rows[0].length;c.height=rows.length;const x=c.getContext('2d');
  rows.forEach((r,j)=>[...r].forEach((ch,i)=>{x.fillStyle=ch==='#'?'#000':'#fff';x.fillRect(i,j,1,1);}));return ctx.createPattern(c,'repeat');}
const P50=mkPat(['#.','.#']),P25=mkPat(['#...','....','..#.','....']),P12=mkPat(['#.......','........','........','........','....#...','........','........','........']),PLINE=mkPat(['#','.']);
const B='#000',WH='#fff';
// The screen is drawn in 640x400 logical units at the display's own resolution (K device
// pixels per unit). Fills snap to whole device pixels so lines stay even at any scale.
let K=1;
const sn=v=>Math.round(v*K)/K;
const clr=(x,y,w,h,c)=>{ctx.fillStyle=c;const mn=Math.max(1,Math.round(K))/K;let x0=sn(x),y0=sn(y),x1=sn(x+w),y1=sn(y+h);
  if(w>0&&(w<=1.01||x1-x0<mn))x1=x0+mn*Math.max(1,Math.round(w));if(h>0&&(h<=1.01||y1-y0<mn))y1=y0+mn*Math.max(1,Math.round(h));ctx.fillRect(x0,y0,x1-x0,y1-y0);};
const box=(x,y,w,h,fill=WH)=>{clr(x,y,w,h,B);clr(x+1,y+1,w-2,h-2,fill);};
const hl=(x,y,w,c=B)=>clr(x,y,w,1,c),vl=(x,y,h,c=B)=>clr(x,y,1,h,c);
const dstep=step=>Math.max(2,Math.round(step*Math.max(1,Math.round(K))))/K;
const dotV=(x,y,h,step=2)=>{const d=dstep(step),y0=sn(y);for(let v=y0;v<y+h;v+=d)clr(x,v,1,1,B);};
const dotH=(x,y,w,step=2)=>{const d=dstep(step),x0=sn(x);for(let v=x0;v<x+w;v+=d)clr(v,y,1,1,B);};
function T(s,x,y,c=B,al='left',f=16){ctx.font=f+'px VT323';ctx.fillStyle=c;ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(s,x,y);}
const tw=(s,f=16)=>{ctx.font=f+'px VT323';return ctx.measureText(s).width;};
let regions=[];
const reg=(x,y,w,h,o)=>regions.push({x,y,w,h,...o});

function mk(w,h,fn){const a=[];for(let y=0;y<h;y++){let r='';for(let x=0;x<w;x++)r+=fn(x,y);a.push(r);}return a;}
const CUR={
  arrow:{h:[0,0],b:['#','##','###','####','#####','######','#######','########','#########','#####','##.##','#..##','....##','.....##','......#']},
  pencil:{h:[0,13],b:mk(14,14,(x,y)=>{const d=x+y-13;if(x<=2)return Math.abs(d)<=x?'#':' ';if(x>=12&&Math.abs(d)<=2)return '#';if(Math.abs(d)===2)return '#';if(Math.abs(d)<2)return d===0?'#':'.';return ' ';})},
  eraser:{h:[0,5],b:['#############','#.......#####','#.......#####','#.......#####','#.......#####','#############']},
  scissors:{h:[3,3],b:['#.....#','##...##','.##.##.','..###..','...#...','..#.#..','.##.##.','#..#..#','#..#..#','.##.##.']},
  glue:{h:[2,0],b:['..##..','..##..','.####.','#....#','#.##.#','#.##.#','#....#','#.##.#','#....#','######']},
  mute:{h:[4,4],b:['#########','#.......#','#.#...#.#','#.##.##.#','#.#.#.#.#','#.#...#.#','#.#...#.#','#.......#','#########']},
  resize:{h:[6,2],b:['..#.....#..','.##.....##.','###########','.##.....##.','..#.....#..']},
  cross:{h:[5,5],b:['....#....','....#....','....#....','.........','###...###','.........','....#....','....#....','....#....'].map(r=>r.replace(/\./g,' '))},
  vert:{h:[2,6],b:['..#..','.###.','#####','..#..','..#..','..#..','..#..','..#..','#####','.###.','..#..']}
};
function drawBm(c,x,y,center){
  const b=c.b;let ox=x-c.h[0],oy=y-c.h[1];
  if(center){ox=Math.round(x-b[0].length/2);oy=Math.round(y-b.length/2);}
  ctx.fillStyle=WH;
  b.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch!==' ')clr(ox+i-1,oy+j-1,3,3,WH);}));
  b.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch==='#')clr(ox+i,oy+j,1,1,B);else if(ch==='.')clr(ox+i,oy+j,1,1,WH);}));
}

const tickToX=t=>TLX+(t/BAR-S.scroll)*BARPX;
const xToTick=x=>((x-TLX)/BARPX+S.scroll)*BAR;
const fmtPos=t=>{t=Math.max(0,Math.floor(t));return pad(Math.floor(t/BAR)+1,4)+'.'+pad(Math.floor(t%BAR/PPQ)+1,2)+'.'+pad(t%PPQ,3);};
const fmtBB=t=>pad(Math.floor(t/BAR)+1,4)+'.'+pad(Math.floor(t%BAR/PPQ)+1,2);

/* knobs drawn in 1-bit: a ring, a pointer and the value */
function knobGfx(cx,cy,r,frac,bip,inv){
  const fg=inv?WH:B;
  ctx.fillStyle=fg;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
  ctx.fillStyle=inv?B:WH;ctx.beginPath();ctx.arc(cx,cy,r-1.5,0,7);ctx.fill();
  if(bip)clr(cx,cy-r-3,1,2,fg);
  const a=(-135+270*frac)*Math.PI/180;
  ctx.strokeStyle=fg;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.sin(a)*(r-2),cy-Math.cos(a)*(r-2));ctx.stroke();
  for(const e of [-135,135]){const b=e*Math.PI/180;clr(Math.round(cx+Math.sin(b)*(r+3)),Math.round(cy-Math.cos(b)*(r+3)),1,1,fg);}
}
/* a knob cell: label, knob, value. Returns nothing; registers drag/wheel/double-click */
function knobCell(x,y,w,label,v,min,max,def,set,hint,valTxt,opts){
  opts=opts||{};
  T(label,x+4,y+7);
  const frac=(v-min)/(max-min);
  knobGfx(x+16,y+27,10,frac,min<0,false);
  T(valTxt!=null?valTxt:String(v),x+32,y+28,B,'left',opts.big?20:16);
  const range=max-min,px=range>20?2:Math.max(4,Math.round(90/range));
  let acc=0;
  reg(x,y,w,42,{drag:(d,e)=>{acc+=d*(e.shiftKey?0.25:1);const st=Math.trunc(acc/px);if(st){acc-=st*px;set(clamp(v=v+st,min,max));}},
    wheel:(d,e)=>set(clamp(v=v-d*(e.shiftKey?1:(range>20?2:1)),min,max)),dbl:()=>set(def),hint,cur:'vert'});
}
/* a switch cell: label and one box per option */
function switchCell(x,y,w,label,v,opts,set,hint,icons){
  T(label,x+4,y+7);
  const n=opts.length,tmax=Math.max(...opts.map(o=>tw(String(o)))),bw=icons?Math.min(26,Math.floor((w-6)/n)):Math.max(26,Math.ceil(tmax)+12);
  for(let i=0;i<n;i++){const bx=x+4+i*bw,on=i===v;box(bx,y+17,bw-2,18,on?B:WH);
    if(icons)waveIcon(i,bx+(bw-2)/2,y+26,on?WH:B);else{const tws=tw(opts[i]);T(opts[i],bx+(bw-2)/2,y+26,on?WH:B,'center',tws>bw-6?Math.max(11,Math.floor(16*(bw-6)/tws)):16);}
    reg(bx,y+15,bw,22,{down:()=>set(i),hint});}
  reg(x,y,w,15,{wheel:d=>set(clamp(v-d,0,n-1)),hint});
}
function waveIcon(i,cx,cy,c){
  ctx.strokeStyle=c;ctx.lineWidth=1;ctx.beginPath();const x=cx-8,y=cy;
  if(i===0){ctx.moveTo(x,y+4);ctx.lineTo(x+4,y-4);ctx.lineTo(x+12,y+4);ctx.lineTo(x+16,y-4);}
  else if(i===1){ctx.moveTo(x,y+4);ctx.lineTo(x+8,y-4);ctx.lineTo(x+8,y+4);ctx.lineTo(x+16,y-4);ctx.lineTo(x+16,y+4);}
  else if(i===2){ctx.moveTo(x,y+4);ctx.lineTo(x,y-4);ctx.lineTo(x+8,y-4);ctx.lineTo(x+8,y+4);ctx.lineTo(x+16,y+4);ctx.lineTo(x+16,y-4);}
  else{for(let k=0;k<=16;k+=2)ctx.lineTo(x+k,y+((k*7)%9)-4);}
  ctx.stroke();
}

    const g=gateLen();snapshot();
    if(n){n.d=g;selOnly(n);audition(n.p,n.v);songChanged();return;}
    let last=-1;const paint=x2=>{const t=clamp(Math.floor((x2-GX)/ppt/24)*24,0,p.len-24);if(t===last)return;last=t;
      if(!p.notes.some(o=>o.t===t&&o.p===pitch)){const nn={t,p:pitch,v:S.newVel,d:g};p.notes.push(nn);selOnly(nn);}};
    paint(x);audition(pitch,S.newVel);S.drag={move:x2=>paint(x2),up:songChanged};return;}
  if(n){
    if(e.shiftKey&&tool==='pointer'){if(isSel(n)){S.selSet.delete(n);if(S.selNote===n)S.selNote=null;}else{S.selSet.add(n);S.selNote=n;}return;}
    if(!isSel(n))selOnly(n);else S.selNote=n;
    audition(n.p,n.v);
    // the clicked note is the reference; every selected note moves or stretches by the same amount
    const edge=tool==='pencil'||x>=noteRight(n)-3,ox=x,oy=y,ot=n.t,op=n.p,od=n.d,grp=selList().map(m=>({m,t:m.t,p:m.p,d:m.d}));let started=false;
    S.drag={move:(x2,y2,ev)=>{if(!started&&Math.abs(x2-ox)<3&&Math.abs(y2-oy)<3)return;if(!started){snapshot();started=true;}
      const g=ev.altKey?1:q(),dt=(x2-ox)/ppt;
      if(edge){const dd=Math.round((od+dt)/g)*g-od;for(const o of grp)o.m.d=Math.max(Math.min(g,q()),o.d+dd);}
      else{
        let dT=Math.round((ot+dt)/g)*g-ot,dP=-Math.round((y2-oy)/NH);
        const minT=Math.min(...grp.map(o=>o.t)),maxT=Math.max(...grp.map(o=>o.t)),minP=Math.min(...grp.map(o=>o.p)),maxP=Math.max(...grp.map(o=>o.p));
        dT=clamp(dT,-minT,p.len-1-maxT);dP=clamp(dP,-minP,127-maxP);
        const moved=n.p!==op+dP;for(const o of grp){o.m.t=o.t+dT;o.m.p=o.p+dP;}if(moved)audition(n.p,n.v);}},up:()=>{if(started)songChanged();}};
    return;}
  if(tool==='pointer'&&!dbl){

    const pick=()=>{const b=S.band,t0=(Math.min(b.x0,b.x1)-GX)/ppt,t1=(Math.max(b.x0,b.x1)-GX)/ppt,
        p0=S.editHi-Math.floor((Math.max(b.y0,b.y1)-GY)/NH),p1=S.editHi-Math.floor((Math.min(b.y0,b.y1)-GY)/NH);
      S.selSet=new Set(keep);for(const m of p.notes)if(m.p>=p0&&m.p<=p1&&m.t<t1&&m.t+m.d>t0)S.selSet.add(m);S.selNote=selList()[0]||null;};
    S.drag={move:(x2,y2)=>{S.band.x1=clamp(x2,GX,W-1);S.band.y1=clamp(y2,GY,GY+NH*NROWS-1);pick();},up:()=>{S.band=null;dirty=true;}};
    return;}
  selOnly(null);
  if(tool==='pencil'||dbl){snapshot();const st=clamp(Math.floor(tk/q())*q(),0,p.len-1);const nn={t:st,p:pitch,v:100,d:q()};p.notes.push(nn);selOnly(nn);audition(pitch,100);
    S.drag={move:x2=>{nn.d=Math.max(q(),Math.ceil(((x2-GX)/ppt-st)/q())*q());}};}
}

/* ---------- hints ---------- */

    const tl={pointer:['Pointer','Drag on empty grid to select a group; Shift-click adds or removes a note; Ctrl+A selects all. Dragging a selected note moves or stretches the whole group (Alt: no snap). Ctrl+C/X/V copy, cut, paste at the song position. Double-click empty grid adds a note.'],

/* ---------- KAOSS pad window ---------- */
const PADR={x:8,y:62,w:400,h:268};
function padTarget(axis,d){const k=axis==='x'?'padX':'padY',ti=inputTrack();let v=S[k];for(let n=0;n<NA;n++){v=(v+d+NA)%NA;if(!PD(ti,v)[6])break;}S[k]=v;songChanged();dirty=true;}
function padApply(fx,fy){
  S.padVX=fx;S.padVY=fy;const ti=inputTrack();
  for(const [id,f] of [[S.padX,fx],[S.padY,fy]]){const p=PD(ti,id);if(!p[6])setParam(ti,id,p[2]+f*(p[3]-p[2]),false);}
}
const padAt=(x,y)=>padApply(clamp((x-PADR.x)/PADR.w,0,1),clamp(1-(y-PADR.y)/PADR.h,0,1));
function padDown(x,y){ensureAudio();S.padOn=true;padAt(x,y);S.drag={move:(x2,y2)=>padAt(x2,y2),up:padUp};}
function padUp(){
  S.padOn=false;const ti=inputTrack();recRelease(ti,[S.padX,S.padY]);
  for(const id of [S.padX,S.padY]){const t=S.tracks[ti];if(t.lv[id]!==t.k[id]&&!(S.playing&&hasLane(ti,id))){t.lv[id]=t.k[id];post({t:'ev',ev:[{time:0,k:'knob',tr:ti,id,v:t.k[id]}]});}}
  dirty=true;
}
function hasLane(ti,id){return S.parts.some(p=>p.track===ti&&p.auto&&p.auto[id]&&p.auto[id].pts.length);}

  const ti=inputTrack(),t=S.tracks[ti],R=PADR;

  box(22,40,16,14);T('>',30,47,B,'center');reg(22,40,16,14,{down:()=>setActive(ti+1),hint:['Next track','','↓']});
  T('T'+(ti+1)+' '+t.name.toUpperCase(),44,47);
  if(S.rec&&S.playing){clr(W-212,40,208,14,B);T('RECORDING AUTOMATION',W-108,47,WH,'center');}
  else T('Record + play to write moves',W-8,47,B,'right');

  for(let i=1;i<8;i++){dotV(R.x+Math.round(i*R.w/8),R.y,R.h,4);dotH(R.x,R.y+Math.round(i*R.h/8),R.w,4);}
  const DX=PD(ti,S.padX),DY=PD(ti,S.padY),vx=clamp((t.lv[S.padX]-DX[2])/(DX[3]-DX[2]),0,1),vy=clamp((t.lv[S.padY]-DY[2])/(DY[3]-DY[2]),0,1);

  else{box(px-5,py-5,11,11);}
  clr(R.x+1,R.y+R.h-15,tw('X '+DX[1])+8,14,B);T('X '+DX[1],R.x+5,R.y+R.h-8,WH);

  reg(R.x,R.y,R.w,R.h,{pad:true,cur:'cross',hint:['KAOSS pad','Drag to move the X and Y knobs of the active track. Releasing returns them to the patch values. With Record on during playback the moves become automation.','']});
  const x0=424,cw=W-x0-8;
  const axis=(ax,y)=>{const id=ax==='x'?S.padX:S.padY;
    T(ax.toUpperCase()+' AXIS',x0,y);

    const nm=PD(ti,id)[1];box(x0+18,y+8,cw-36,18);T(nm.slice(0,22),x0+cw/2,y+17,B,'center',nm.length>19?14:16);
    T('value '+pfmtT(ti,id,t.lv[id])+'   patch '+pfmtT(ti,id,t.k[id]),x0,y+36);

    reg(bx,206,cw/2-2,18,{down:()=>{S.padMode=m;songChanged();dirty=true;},hint:['Automation curve','SMOOTH draws a line between recorded points; HOLD keeps each value until the next, for stepped sequences. Applies to lanes recorded from now on.','']});});

/* ---------- manual window ---------- */
const MAN_X=8,MAN_W=W-30,MAN_LH=16,MAN_Y=58,MAN_VIS=Math.floor((TBY-MAN_Y-2)/MAN_LH);
let manLines=null;
function wrap(text,w,f){const out=[];let line='';for(const word of text.split(' ')){const t=line?line+' '+word:word;if(tw(t,f)>w&&line){out.push(line);line=word;}else line=t;}out.push(line);return out;}
function buildManual(){
  // flatten MANUAL into display lines: [kind, text, extra]; headings remember their line for the contents
  const L=[],heads=[];
  for(const e of MANUAL){
    if(e[0]==='h'){if(L.length)L.push(['sp','']);heads.push([e[1],L.length]);L.push(['h',e[1]]);}
    else if(e[0]==='p'){for(const l of wrap(e[1],MAN_W))L.push(['p',l]);L.push(['sp','']);}
    else if(e[0]==='b'){wrap(e[1],MAN_W-16).forEach((l,i)=>L.push(['b',l,i===0]));}
    else if(e[0]==='k'){const kw=150;wrap(e[2],MAN_W-kw).forEach((l,i)=>L.push(['k',l,i===0?e[1]:'']));}
  }
  manLines={L,heads};
}
function drawManual(){
  if(!manLines)buildManual();const {L,heads}=manLines;
  clr(0,38,W,TBY-38,WH);
  // contents row
  clr(0,38,W,18,WH);hl(0,55,W);
  let cx=6;const cur=heads.filter(h=>h[1]<=S.manTop+1).pop();
  T('GO TO',cx,47,B,'left',14);cx+=tw('GO TO',14)+8;
  box(cx,40,W-cx-6,14);T((cur?cur[0]:heads[0][0])+'  ▾',cx+6,47,B,'left',14);
  reg(cx,40,W-cx-6,14,{down:()=>{S.popup={x:cx,y:56,items:heads.map(h=>({l:(h===cur?'√ ':'  ')+h[0],a:()=>{S.manTop=h[1];}}))};},hint:['Contents','Jump to a section.','']});
  S.manTop=clamp(S.manTop||0,0,Math.max(0,L.length-MAN_VIS));
  for(let i=0;i<MAN_VIS;i++){const ln=L[S.manTop+i];if(!ln)break;const y=MAN_Y+i*MAN_LH+MAN_LH/2;
    if(ln[0]==='h'){clr(MAN_X-4,y-7,MAN_W+8,15,B);T(ln[1].toUpperCase(),MAN_X,y,WH);}
    else if(ln[0]==='p')T(ln[1],MAN_X,y);
    else if(ln[0]==='b'){if(ln[2])clr(MAN_X+3,y-2,4,4,B);T(ln[1],MAN_X+16,y);}
    else if(ln[0]==='k'){if(ln[2]){T(ln[2],MAN_X,y,B,'left',ln[2].length>22?13:16);}T(ln[1],MAN_X+150,y);}
  }
  // scroll bar
  const sbx=W-14,sby=MAN_Y,sbh=MAN_VIS*MAN_LH;box(sbx,sby,10,sbh);
  const th=Math.max(16,sbh*MAN_VIS/L.length),ty=sby+(sbh-th)*(S.manTop/Math.max(1,L.length-MAN_VIS));
  ctx.fillStyle=P50;clr(sbx+1,sby+1,8,sbh-2,P50);box(sbx,ty,10,th);
  let acc=0;
  reg(sbx-2,sby,14,sbh,{drag:d=>{acc-=d;const st=Math.trunc(acc/(sbh/L.length));if(st){acc-=st*sbh/L.length;S.manTop+=st;dirty=true;}},wheel:d=>{S.manTop+=d*3;dirty=true;},hint:['Scroll','Drag, scroll, or use the arrow and Page keys.','PgUp PgDn'],cur:'vert'});
  reg(0,MAN_Y,W-16,sbh,{wheel:d=>{S.manTop+=d*3;dirty=true;},hint:['Manual','Scroll with the wheel, the arrow keys or Page Up / Page Down. Esc returns to Arrange.','F9']});
}

/* ---------- status line ---------- */
const hT=$('#hintT'),hD=$('#hintD'),hK=$('#hintK');
let lastHint='',msgUntil=0;
function showHint(t,d,k){if(performance.now()<msgUntil)return;const key=t+d+k;if(key===lastHint)return;lastHint=key;hT.textContent=t||'ARRANGER ST';hD.textContent=d;hK.textContent=k||'';hK.hidden=!k;}

/* ---------- on-screen keyboard ---------- */
const kb=$('#kb');let kbKeys={};
function buildKb(){
  kb.innerHTML='';kbKeys={};const b=base(),n=30;let wi=0;const whites=[];
  for(let i=0;i<n;i++)if(!isBlack(b+i))whites.push(i);
  const ww=100/whites.length;
  for(let i=0;i<n;i++){const p=b+i,el=document.createElement('div'),black=isBlack(p);
    const lbl=i<13?LOWLBL[i]:(i-12<UPLBL.length?UPLBL[i-12]:'');
    if(!black){el.className='w';el.style.left=(wi*ww)+'%';el.style.width=ww+'%';wi++;}
    else{el.className='k';el.style.left=(wi*ww-ww*0.3)+'%';el.style.width=(ww*0.6)+'%';}
    el.innerHTML=(lbl?`<span>${lbl}</span>`:'')+(p%12===0?`<small>${nname(p)}</small>`:'');
    el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);noteOn('s:'+p,p,100);});
    const off=()=>noteOff('s:'+p);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);
    kb.appendChild(el);kbKeys[p]=el;}
}
function kbLight(p,on){const el=kbKeys[p];if(el)el.classList.toggle('on',on);}
kb.addEventListener('pointerenter',()=>showHint('On-screen keys','Click to play the active track. Labels show the computer key for each note; physical positions, so QWERTZ and AZERTY work the same.','- ='));

/* ---------- loop & layout ---------- */
const statusEl=$('#status');
let scaleMode='auto';try{scaleMode=localStorage.getItem('arranger-st.scale2')||'auto';}catch(e){}
function fit(){
  const dpr=window.devicePixelRatio||1,aw=window.innerWidth-32;
  const fw=Math.max(1,Math.min(aw/640,(window.innerHeight-20)/500));
  let k;
  if(scaleMode==='1'||scaleMode==='2'||scaleMode==='3')k=(+scaleMode)*dpr;   // fixed size; the page scrolls if it does not fit
  else{
    const ah=window.innerHeight-20-Math.round(26*fw)-(S.showKb?Math.round(74*fw):0);
    k=Math.min(aw/640,ah/400)*dpr;
    if(scaleMode==='auto'&&k>=1)k=Math.floor(k);                     // whole device pixels per screen pixel
    k=Math.max(0.3*dpr,k);
  }
  cv.width=Math.round(640*k);cv.height=Math.round(400*k);K=cv.width/W;
  const w=cv.width/dpr,h=cv.height/dpr,f=clamp(w/640*0.75,1,2.4);
  document.documentElement.style.setProperty('--u',f.toFixed(3));
  document.body.style.overflow=w>window.innerWidth||h+100*f>window.innerHeight?'auto':'hidden';
  cv.style.width=w+'px';cv.style.height=h+'px';statusEl.style.width=w+'px';kb.style.width=w+'px';kb.hidden=!S.showKb;dirty=true;
}
function setScale(m){scaleMode=m;try{localStorage.setItem('arranger-st.scale2',m);}catch(e){}fit();}
window.addEventListener('resize',fit);
document.addEventListener('pointerdown',()=>ensureAudio(),{once:true});

function frame(){
  if(S.playing&&ac){
    const cur=curTick();
    if(S.rec){if(S.recMode==='replace')eraseReplace(prevTick,cur);for(const h of held.values())if(h.rn)h.rn.n.d=recLen(h.rn);
      if(S.padOn){const ti=inputTrack();for(const [id,f] of [[S.padX,S.padVX],[S.padY,S.padVY]]){const p=PD(ti,id);if(!p[6])recAuto(ti,id,Math.round(p[2]+f*(p[3]-p[2])));}}}
    prevTick=cur;S.pos=cur;
    if(!cycOn()&&cur>=NBARS*BAR){stop();S.pos=0;}
    if(S.view==='arr'){const bar=Math.floor(cur/BAR);if(bar>=S.scroll+VIS||bar<S.scroll)S.scroll=clamp(bar,0,NBARS-VIS);}
    const now=ac.currentTime;while(liveQ.length&&liveQ[0].at<=now){const u=liveQ.shift();if(!autoHeld.has(u.tr+':'+u.id))S.tracks[u.tr].lv[u.id]=u.v;}
    liveQ.sort((a,b)=>a.at-b.at);
    dirty=true;
  }
  if(gate.some(g=>g>0)||S.step||S.input||held.size||performance.now()-S.inFlash<500||meters.l>0.001)dirty=true;
  meters.l*=0.97;meters.r*=0.97;for(let i=0;i<8;i++)meters.tr[i]*=0.97;
  if(dirty){dirty=false;render();}
  requestAnimationFrame(frame);
}
window.__ast={S,get ac(){return ac},get ready(){return ready},meters};
(function boot(){
  let ok=false;
  try{const s=localStorage.getItem(LS_KEY);if(s){loadSong(JSON.parse(s));ok=true;}}catch(e){ok=false;}
  if(!ok)loadDemo();
  buildKb();fit();
  (document.fonts?document.fonts.load('16px VT323'):Promise.resolve()).catch(()=>{}).then(()=>{dirty=true;requestAnimationFrame(frame);});
})();
})();
